name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deployment is handled by Cloudflare Pages' own Git integration, which builds
# from this repo directly. This workflow only guards quality.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
