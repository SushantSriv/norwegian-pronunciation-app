name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the leaderboard worker's tests run the real handler
          # against node:sqlite, which is only a built-in from 22.5 onwards.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The FULL check, across both tsconfig projects. `npm run build` only
      # compiles the one that ships, deliberately: a site build has no business
      # failing over a Node development script. This is where the rest is
      # caught.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Where the shared exam room lives. Unset, the pair feature is not
          # offered at all — an app should not show a button that cannot work —
          # so this is what makes "øv sammen" visible on the deployed site.
          VITE_ROOM_URL: https://norsk-uttale-rom.sushantsrivastava198.workers.dev

      # enablement lets the workflow switch Pages back on by itself. Toggling
      # the repo private and public again silently disables Pages, and without
      # this the deploy fails with a bare "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
