# Deploying the leaderboard is optional. The app works completely without it;
# see README.md in this directory before running anything here.

name = "norsk-uttale-leaderboard"
main = "worker.ts"
compatibility_date = "2025-01-01"

# Where the app is served from. Requests from anywhere else get the first
# origin in the list back, which browsers will refuse.
#
# Comma-separated, so the GitHub Pages origin and a custom domain can both be
# allowed while a move is in progress. Update this BEFORE pointing the domain
# at the site, or the first thing the new domain does is fail every sync.
[vars]
ALLOWED_ORIGINS = "https://sushantsriv.github.io"
# With a domain, this becomes something like:
# ALLOWED_ORIGINS = "https://norskuttale.no,https://www.norskuttale.no,https://sushantsriv.github.io"

# Serve the worker from a subdomain of your own instead of workers.dev. The
# zone must already be on Cloudflare; `wrangler deploy` creates the DNS record.
# Then build the app with VITE_LEADERBOARD_URL=https://api.<your-domain>
# [[routes]]
# pattern = "api.norskuttale.no"
# custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "norsk-uttale-leaderboard"
# Filled in by `wrangler d1 create norsk-uttale-leaderboard`.
database_id = "REPLACE_ME"
